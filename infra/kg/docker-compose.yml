# Neo4j Graph Database for recruit_system Knowledge Graph (KB1 + KB2).
#   cp infra/kg/.env.example infra/kg/.env   # then set a password
#   docker compose -f infra/kg/docker-compose.yml --env-file infra/kg/.env up -d
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: recruit-kg-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in infra/kg/.env}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - kg_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  kg_data:
