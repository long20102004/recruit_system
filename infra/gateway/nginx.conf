server {
    listen 8080;
    server_name _;
    client_max_body_size 12m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 240s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Resolve service DNS again after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /health { default_type application/json; return 200 '{"status":"ok","service":"api-gateway"}'; }
    location ~ ^/internal(?:/|$) { return 404; }
    location ~ ^/api/(?:auth|admin/users)(?:/|$) {
        set $identity http://identity-service:8081;
        proxy_pass $identity$request_uri;
    }
    location ~ ^/api/interviews(?:/|$) {
        set $interview http://interview-service:8083;
        proxy_pass $interview$request_uri;
    }
    location ~ ^/api/(?:jobs|cvs|applications|matching|dashboard)(?:/|$) {
        set $recruitment http://recruitment-service:8082;
        proxy_pass $recruitment$request_uri;
    }
    location / { return 404; }
}
