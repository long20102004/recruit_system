<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phỏng vấn — HireLens</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <header class="site-header" data-header></header>

    <main class="page">
      <header class="page-head">
        <h1>Câu hỏi & kết quả phỏng vấn</h1>
        <p>Quản lý ngân hàng câu hỏi theo tiêu chí chấm, và xem kết quả phiên gần nhất của ứng viên.</p>
      </header>

      <section class="grid-2">
        <article class="panel">
          <h2>Ngân hàng câu hỏi</h2>
          <div id="qList"></div>
        </article>
        <article class="panel">
          <h2>Phiên gần nhất</h2>
          <div id="sessionBox"></div>
        </article>
      </section>
    </main>

    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
      HireLens.setRole("recruiter");
      HireLens.renderHeader("interviews", "recruiter");

      document.getElementById("qList").innerHTML = HireLensMock.interviewQuestions
        .map(
          (q) => `
          <article style="padding:1rem 0;border-bottom:1px solid var(--line)">
            <strong>${q.question}</strong>
            <div style="margin:.4rem 0">
              <span class="chip">${q.topic}</span>
              <span class="chip accent">${q.difficulty}</span>
              <span class="chip ok">${q.skill}</span>
            </div>
            <p class="muted" style="margin:0 0 .35rem"><strong>Đáp án tham chiếu:</strong> ${q.referenceAnswer}</p>
            <div>
              <span class="muted" style="font-size:.85rem">Tiêu chí chấm: </span>
              ${q.rubric.map((r) => `<span class="chip warn">${r}</span>`).join("")}
            </div>
          </article>`
        )
        .join("");

      const s = HireLensMock.interviewSession;
      const ev = s.responses[0].evaluation;
      document.getElementById("sessionBox").innerHTML = `
        <div class="kv">
          <div class="kv-row"><label>Ứng viên</label><div>${s.candidateName}</div></div>
          <div class="kv-row"><label>Vị trí</label><div>${s.jobTitle}</div></div>
          <div class="kv-row"><label>Trạng thái</label><div><span class="chip">${s.status}</span></div></div>
          <div class="kv-row"><label>Điểm</label><div><strong>${ev.predictedScore}/10</strong></div></div>
          <div class="kv-row"><label>Ý đã nêu</label><div>${ev.coveredPoints.map((p) => `<span class="chip ok">${p}</span>`).join("")}</div></div>
          <div class="kv-row"><label>Ý còn thiếu</label><div>${ev.missingPoints.map((p) => `<span class="chip warn">${p}</span>`).join("")}</div></div>
          <div class="kv-row"><label>Nhận xét</label><div>${ev.comment}</div></div>
        </div>`;
    </script>
  </body>
</html>
