<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghép hồ sơ — HireLens</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <header class="site-header" data-header></header>

    <main class="page">
      <header class="page-head">
        <h1>Ghép hồ sơ với tin tuyển dụng</h1>
        <p>Danh sách ứng viên xếp theo mức phù hợp với từng vị trí — kèm kỹ năng trùng và còn thiếu.</p>
      </header>

      <section class="panel">
        <table class="table">
          <thead>
            <tr>
              <th>Hạng</th>
              <th>Vị trí</th>
              <th>Mức phù hợp</th>
              <th>Kỹ năng</th>
              <th>Ghi chú</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>
    </main>

    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
      HireLens.setRole("recruiter");
      HireLens.renderHeader("matching", "recruiter");
      document.getElementById("tbody").innerHTML = HireLensMock.matchingResults
        .map((r) => {
          const job = HireLens.jobById(r.jobId);
          if (!job) return "";
          return `
            <tr>
              <td><strong>#${r.rank}</strong></td>
              <td>${job.title}<br /><span class="muted">${job.company} · ${job.location}</span></td>
              <td><strong>${HireLens.pct(r.score)}%</strong></td>
              <td>
                ${r.matchedSkills.map((s) => `<span class="chip ok">${s}</span>`).join("")}
                ${r.missingSkills.map((s) => `<span class="chip warn">Thiếu: ${s}</span>`).join("")}
              </td>
              <td class="muted">${r.reasons[0]}</td>
            </tr>`;
        })
        .join("");
    </script>
  </body>
</html>
