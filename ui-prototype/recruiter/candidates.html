<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ứng viên — HireLens</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <div class="demo-banner">Module 1 · <span>CV và PII cần bảo vệ ở bản production</span></div>
    <header class="site-header" data-header></header>

    <main class="page">
      <header class="page-head">
        <h1>Ứng viên & CV đã phân tích</h1>
        <p>Xem hồ sơ dạng thẻ + JSON schema — giống trang quản lý ứng viên trên job board.</p>
      </header>

      <section class="grid-2">
        <article class="panel">
          <h2>Hồ sơ</h2>
          <div class="kv" id="profile"></div>
        </article>
        <article class="panel">
          <h2>JSON trích xuất (schema mẫu)</h2>
          <pre id="jsonView" style="margin:0;padding:1rem;background:#0f172a;color:#e2e8f0;border-radius:14px;overflow:auto;font-size:.82rem;line-height:1.45;max-height:420px"></pre>
        </article>
      </section>
    </main>

    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
      HireLens.setRole("recruiter");
      HireLens.renderHeader("candidates", "recruiter");
      const c = HireLensMock.candidate;
      const cv = HireLensMock.extractedCv;
      document.getElementById("profile").innerHTML = `
        <div class="kv-row"><label>Ứng viên</label><div><strong>${c.name}</strong><br>${c.email}<br><span class="muted">${c.city}</span></div></div>
        <div class="kv-row"><label>File</label><div>${cv.sourceFile}</div></div>
        <div class="kv-row"><label>Trạng thái</label><div><span class="chip warn">${cv.status}</span></div></div>
        <div class="kv-row"><label>Kỹ năng</label><div>${cv.skills.map((s) => `<span class="chip ok">${s}</span>`).join("")}</div></div>
        <div class="kv-row"><label>Dự án</label><div>${cv.projects.map((p) => p.name).join(", ")}</div></div>
      `;
      document.getElementById("jsonView").textContent = JSON.stringify(
        {
          contact: cv.contact,
          summary: cv.summary,
          education: cv.education,
          experience: cv.experience,
          projects: cv.projects,
          skills: cv.skills,
          languages: cv.languages,
          certificates: cv.certificates,
          meta: {
            confidence: cv.confidence,
            modelVersion: HireLensMock.meta.modelVersions.ner,
            demo: true,
          },
        },
        null,
        2
      );
    </script>
  </body>
</html>
