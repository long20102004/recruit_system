<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phỏng vấn — HireLens</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <header class="site-header" data-header></header>

    <main class="page">
      <header class="page-head">
        <h1>Luyện phỏng vấn</h1>
        <p id="sessionMeta"></p>
      </header>

      <section class="grid-2">
        <article class="panel">
          <h2 id="qTitle">Câu hỏi</h2>
          <div class="chat" id="chat"></div>
          <div class="field" style="margin-top:1rem">
            <label for="answer">Câu trả lời của bạn</label>
            <textarea id="answer" rows="4" placeholder="Nhập câu trả lời…"></textarea>
          </div>
          <div class="split-actions">
            <button class="btn btn-primary" id="btnSubmit" type="button">Gửi & nhận đánh giá</button>
            <button class="btn btn-ghost" id="btnNext" type="button">Câu tiếp theo</button>
          </div>
        </article>

        <article class="panel">
          <h2>Kết quả đánh giá</h2>
          <p class="muted">Điểm theo thang 0–10 kèm các ý đã nêu và ý còn thiếu theo tiêu chí vị trí.</p>
          <div id="evalBox" class="empty-note" style="margin-top:1rem">
            Chưa có đánh giá. Hãy gửi một câu trả lời để xem điểm và góp ý.
          </div>
        </article>
      </section>
    </main>

    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
      HireLens.setRole("candidate");
      HireLens.renderHeader("interview", "candidate");

      const questions = HireLensMock.interviewQuestions;
      const session = HireLensMock.interviewSession;
      let idx = 0;

      document.getElementById("sessionMeta").textContent =
        `${session.jobTitle} · ${session.status}`;

      function currentQ() { return questions[idx]; }

      function renderChat(extraUser) {
        const q = currentQ();
        document.getElementById("qTitle").textContent =
          `Câu ${idx + 1}/${questions.length} · ${q.topic} · ${q.difficulty}`;
        let html = `
          <div class="bubble ai">
            <div class="meta">Người phỏng vấn · ${q.skill}</div>
            ${q.question}
          </div>`;
        if (extraUser) {
          html += `<div class="bubble user"><div class="meta">Bạn</div>${extraUser}</div>`;
        }
        document.getElementById("chat").innerHTML = html;
      }

      function renderEval(ev) {
        document.getElementById("evalBox").innerHTML = `
          <div class="eval-block">
            <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.75rem">
              <div class="score-ring" style="--p:${Math.round(ev.predictedScore * 10)}">
                <span>${ev.predictedScore.toFixed(1)}</span>
              </div>
              <div>
                <strong>Điểm / 10</strong>
                <div class="muted" style="font-size:.85rem">Theo tiêu chí của vị trí tuyển dụng</div>
              </div>
            </div>
            <p style="margin:0 0 .75rem">${ev.comment}</p>
            <div>
              ${(ev.coveredPoints || []).map((p) => `<span class="chip ok">${p}</span>`).join("")}
              ${(ev.missingPoints || []).map((p) => `<span class="chip warn">Thiếu: ${p}</span>`).join("")}
            </div>
          </div>`;
      }

      document.getElementById("btnSubmit").addEventListener("click", () => {
        const text = document.getElementById("answer").value.trim();
        if (!text) { HireLens.toast("Hãy nhập câu trả lời"); return; }
        renderChat(text);
        HireLens.toast("Đang đánh giá…");
        setTimeout(() => {
          let ev = session.responses[0]?.evaluation;
          if (idx !== 0 || !ev) {
            const q = currentQ();
            const overlap = q.rubric.filter((r) =>
              text.toLowerCase().includes(r.toLowerCase().slice(0, 6))
            );
            const score = Math.min(9.5, 5 + overlap.length * 1.2 + Math.min(text.length, 80) / 40);
            ev = {
              predictedScore: score,
              coveredPoints: overlap.length ? overlap : ["Đã nêu ý chung"],
              missingPoints: q.rubric.filter((r) => !overlap.includes(r)),
              comment: overlap.length
                ? "Bạn đã nêu được một số ý chính. Bổ sung các ý còn thiếu để điểm cao hơn."
                : "Câu trả lời chưa khớp rõ tiêu chí. Hãy nêu trực tiếp các ý trong yêu cầu vị trí.",
            };
          }
          renderEval(ev);
          HireLens.toast("Đã có kết quả đánh giá");
        }, 700);
      });

      document.getElementById("btnNext").addEventListener("click", () => {
        idx = (idx + 1) % questions.length;
        document.getElementById("answer").value = "";
        document.getElementById("evalBox").innerHTML =
          '<div class="empty-note">Chưa có đánh giá cho câu này.</div>';
        renderChat();
      });

      renderChat();
      if (session.responses[0]) {
        document.getElementById("answer").value = session.responses[0].answer;
      }
    </script>
  </body>
</html>
