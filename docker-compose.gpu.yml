# GPU cho cvmatch-ai và cv-extraction-ai (NVIDIA Container Toolkit / Docker Desktop + WSL2):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile match up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile cv-ai up -d --build
services:
  cv-extraction-ai:
    build:
      dockerfile: Dockerfile.gpu
      args:
        CUDA_ARCH: ${CV_CUDA_ARCH:-75}
    environment:
      N_GPU_LAYERS: ${CV_N_GPU_LAYERS:-99}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  cvmatch-ai:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu130
    environment:
      CVMATCH_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
