# Tang 1 Retrieve. Thiet ke 06, 11 muc 1.2.
version: retrieve-1.0
K: 200
views_enabled: [dense, bm25, skill, resp]   # resp la "thu"
view_weights:                               # bang nhau; chi doi khi co bang chung ro
  dense: 1.0
  bm25: 1.0
  skill: 1.0
  resp: 1.0
normalization: minmax       # minmax | dbsf (thi nghiem RT-E6)
fusion: score_sum           # score_sum | rrf (du phong)
rrf_k: 60
bm25:
  k1: 1.2
  b: 0.75
  query_mode: full_jd       # full_jd | title_skills (RT-E5)
  field: noacc              # noacc | acc
  use_skill_tokens: true
hard_filters:
  enabled: false            # chi khi HR bat; truong thieu -> cho qua
min_pool_warn: 20           # loc cung con it hon so nay -> canh bao HR

reverse:                    # Luong D (CV -> JD)
  only_open: true           # khong tat duoc
  K_max: 50                 # K = min(K_max, so JD mo)
  bm25_query_mode: condensed_cv
  skill:
    min_imp_sum: 3.0        # RT-R3
  min_pool_minmax: 10       # duoi nguong dung RRF (RT-R5)
