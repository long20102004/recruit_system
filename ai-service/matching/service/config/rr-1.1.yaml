# Tang 2 Rerank P2 (T15): bat du 8 feature, A1/A2 qua KB. Giu rr-1.0 (P1) de so. Moi gia tri la (UL).
version: rr-1.1
N: 30
reverse_N: 10

features_enabled: [A1, A2, B4, B5, B1, B2, B3, C1]

weights:                 # tong = 1.00 (Q7); R-E13
  A1: 0.25
  A2: 0.05
  B4: 0.28
  B5: 0.12
  B1: 0.10
  B2: 0.10
  B3: 0.05
  C1: 0.05

a1:
  use_kb_rel: true       # A1/A2 = sum w_imp x max rel(s, r) x ev(s) / sum w_imp (07 muc 5.5)

b4:
  calib: {lo: 0.65, hi: 0.90}         # tu golden; thay bang gia tri theo nhan (R-E5)
  level: {met: 0.6, partial: 0.3}     # nguong muc khop cho Explain
  m_negation: 0.3                     # R-E6
  m_coursework: 0.6                   # R-E6
  generic_weight: 0.0                 # R-E7
  engine: bertscore                   # bertscore | cosine (R-E2) | max (R-E10)
  cos_calib: {lo: 0.55, hi: 0.85}     # hieu chuan cosine cau (chi dung khi engine != bertscore)

b5:
  use_summary: true                   # cau cua summary cung la ung vien phia CV (07 muc 5.4)

b3:                                   # cap bac (07 muc 5.6)
  down_step: 0.3                      # delta <= 0: max(0, 1 - 0,3 |delta|)
  up_step: 0.15                       # delta > 0: max(0,4, 1 - 0,15 delta)
  up_floor: 0.4
  scope_bonus: 1                      # tin hieu pham vi trong gach -> +1 bac
  scope_patterns: patterns/scope_signals.txt
  fresher_cap_years: 2.0
  fresher_rank: 1
  overqual_penalty_reverse: false     # CV -> JD tat phat thua
  rho_warn: 0.7                       # rho(B2, B3) > nguong -> canh bao

c1:                                   # hoc van (07 muc 5.7)
  w_major: 0.6
  w_degree: 0.4
  major_rel: {it: 1.0, related: 0.7, other: 0.3}
  degree_graduated: 1.0
  degree_soon: 0.7
  degree_later: 0.3
  soon_months: 12

align:
  # Do tren bge-m3 that (T12): o layer 24, tu VANG MAT trong mot cap co lien quan van dat 0,78-0,89,
  # tu co mat 0,86-0,98, cap khong lien quan <= 0,72 -> 0,75 danh dau moi tu la "khop".
  # Quy tac: khop neu tu xuat hien nguyen van trong gach (van ban da chuan bi) HOAC cosine >= word_sim_min.
  word_sim_min: 0.90     # thiet ke goc 0,75 (UL); hieu chuan lai o T14
  literal_match: true

rel:
  same: 1.0
  parent_child: 0.7
  sibling: 0.4           # kiem do nhay 0.5

b1:
  recent_months: 36
  recent_boost: 2.0

b2:
  project_personal_weight: 0.3
  overqual_penalty: true            # JD -> CV bat; CV -> JD tat (R-E11)
  overqual_penalty_reverse: false

gate:
  thresholds: [0.5, 0.7]            # R-E12
  caps: [50, 70]

missing:
  cv_side_policy: pool_median       # pool_median | drop | zero (R-E12)

low_data_quality:
  min_missing: 3

score:
  bands: [80, 60]                   # dai nhan hien thi

rr5:
  enabled: false                    # R-X4

cache:
  token_lru_gb: 20
