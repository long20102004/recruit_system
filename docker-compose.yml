services:
  mysql:
    profiles: [legacy]
    image: mysql:8.4
    container_name: hirelens-mysql
    environment:
      MYSQL_DATABASE: recruit_system
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - hirelens_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hirelens_identity
      MYSQL_USER: hirelens
      MYSQL_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - identity_data:/var/lib/mysql
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  recruitment-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hirelens_recruitment
      MYSQL_USER: hirelens
      MYSQL_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - recruitment_data:/var/lib/mysql
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  interview-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hirelens_interview
      MYSQL_USER: hirelens
      MYSQL_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - interview_data:/var/lib/mysql
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  # Redis: khoá tạm đăng nhập, token dùng một lần, cache tóm tắt người dùng (specs/003-auth-flow)
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"   # 6380 để không đụng Redis khác trên máy; chỉ cần khi chạy Java ngoài Docker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Hộp thư dev: SMTP 1025, giao diện xem mail http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  identity-service:
    build:
      context: ./backend
      args:
        SERVICE: identity-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://identity-db:3306/hirelens_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: hirelens
      DB_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      JWT_SECRET: ${JWT_SECRET:-HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
      AI_URL: http://interview-ai:8000
      AI_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      AI_READ_TIMEOUT_MS: 180000
      CV_EXTRACTION_URL: ${CV_EXTRACTION_URL:-http://cv-extraction-ai:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      identity-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8081; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  recruitment-service:
    build:
      context: ./backend
      args:
        SERVICE: recruitment-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://recruitment-db:3306/hirelens_recruitment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: hirelens
      DB_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      JWT_SECRET: ${JWT_SECRET:-HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
      AI_URL: http://interview-ai:8000
      AI_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      AI_READ_TIMEOUT_MS: 180000
      CV_EXTRACTION_URL: ${CV_EXTRACTION_URL:-http://cv-extraction-ai:8000}
      CVMATCH_URL: ${CVMATCH_URL:-http://cvmatch-ai:8000}
      CVMATCH_SYNC_ENABLED: ${CVMATCH_SYNC_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      recruitment-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    volumes:
      - recruitment_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8082; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  interview-service:
    build:
      context: ./backend
      args:
        SERVICE: interview-service
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://interview-db:3306/hirelens_interview?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: hirelens
      DB_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      JWT_SECRET: ${JWT_SECRET:-HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
      AI_URL: http://interview-ai:8000
      AI_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      AI_READ_TIMEOUT_MS: 180000
      CV_EXTRACTION_URL: ${CV_EXTRACTION_URL:-http://cv-extraction-ai:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      interview-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8083; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # API Gateway (Spring Cloud Gateway, backend/api-gateway): định tuyến /api tới 3 service theo URL cấu hình.
  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: 8080
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
    ports:
      - "8080:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      recruitment-service:
        condition: service_healthy
      interview-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  interview-ai:
    profiles: [ai]
    build:
      context: ./ai-service/interview/service
    environment:
      HIRELENS_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      HIRELENS_DEVICE: cpu
      HIRELENS_THREADS: "2"
      HIRELENS_BATCH_SIZE: "4"
      HIRELENS_BERT_MODEL: ${INTERVIEW_BERT_MODEL:-bert-base-multilingual-cased}
      HIRELENS_CRITERION_THRESHOLD: ${INTERVIEW_CRITERION_THRESHOLD:-0.85}
      HIRELENS_OUTPUT: /app/output/module3-v2
      HIRELENS_FINETUNE_DIR: /app/output/bert_finetuned_self/model
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    cpus: 2.0
    mem_limit: 4g
    volumes:
      - interview_model_cache:/root/.cache/huggingface
      - interview_ai_output:/app/output/module3-v2
      - ./ai-service/interview/service/output/bert_finetuned_self/model:/app/output/bert_finetuned_self/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 120s
    ports:
      - "127.0.0.1:8000:8000"

  cv-extraction-ai:
    profiles: [cv-ai]
    build:
      context: ./ai-service/extraction
    environment:
      PROMPT_VERSION: ${CV_MODEL_VERSION:-v4}
      GGUF_MODEL_PATH: /app/merged_model/model-${CV_MODEL_VERSION:-v4}-q4_k_m.gguf
      KG_ENABLED: "true"
    volumes:
      - ./ai-service/models/cv-extraction:/app/merged_model:ro
    ports:
      - "127.0.0.1:8001:8000"


  # Module match CV <-> JD (ai-service/matching/service) + KB snapshot (ai-service/matching/kb-builder). Bat: --profile match.
  cvmatch-db:
    profiles: [match]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cvmatch
      POSTGRES_USER: cvmatch
      POSTGRES_PASSWORD: ${CVMATCH_DB_PASSWORD:-cvmatch-local}
    ports:
      - "127.0.0.1:${CVMATCH_DB_PORT:-5433}:5432"
    volumes:
      - cvmatch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvmatch -d cvmatch"]
      interval: 5s
      timeout: 5s
      retries: 30

  cvmatch-ai:
    profiles: [match]
    build:
      context: ./ai-service/matching/service
      args:
        TORCH_INDEX: ${CVMATCH_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    environment:
      CVMATCH_ENV: prod
      CVMATCH_DB_URL: postgresql://cvmatch:${CVMATCH_DB_PASSWORD:-cvmatch-local}@cvmatch-db:5432/cvmatch
      CVMATCH_HMAC_KEY: ${CVMATCH_HMAC_KEY:-}   # bat buoc khi bat profile match (bootstrap bao loi neu trong)
      CVMATCH_SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      CVMATCH_DEVICE: ${CVMATCH_DEVICE:-cpu}
      CVMATCH_KB_DIR: /kb
      CVMATCH_ONTOLOGY_VERSION: ${CVMATCH_ONTOLOGY_VERSION:-}
      HF_HOME: /root/.cache/huggingface
      OMP_NUM_THREADS: ${CVMATCH_THREADS:-4}
      TOKENIZERS_PARALLELISM: "false"
    cpus: ${CVMATCH_CPUS:-4}
    mem_limit: 6g
    volumes:
      - ./ai-service/matching/kb-builder/out/snapshot:/kb:ro
      - cvmatch_model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      cvmatch-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 600s

volumes:
  hirelens_mysql_data:
  identity_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/mysql/identity
  recruitment_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/mysql/recruitment
  interview_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/mysql/interview
  recruitment_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/uploads
  interview_model_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/interview-huggingface
  interview_ai_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/interview-output
  cvmatch_pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/postgres/cvmatch
  cvmatch_model_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/cvmatch-huggingface
