services:
  mysql:
    profiles: [legacy]
    image: mysql:8.4
    container_name: hirelens-mysql
    environment:
      MYSQL_DATABASE: recruit_system
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - hirelens_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hirelens_identity
      MYSQL_USER: hirelens
      MYSQL_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - identity_data:/var/lib/mysql
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  recruitment-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hirelens_recruitment
      MYSQL_USER: hirelens
      MYSQL_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - recruitment_data:/var/lib/mysql
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  interview-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hirelens_interview
      MYSQL_USER: hirelens
      MYSQL_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - interview_data:/var/lib/mysql
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  identity-service:
    build:
      context: ./backend
      args:
        SERVICE: identity-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://identity-db:3306/hirelens_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: hirelens
      DB_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      JWT_SECRET: ${JWT_SECRET:-HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
      AI_URL: http://interview-ai:8000
      AI_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      AI_READ_TIMEOUT_MS: 180000
      CV_EXTRACTION_URL: ${CV_EXTRACTION_URL:-http://cv-extraction-ai:8000}
      CV_MATCHING_URL: ${CV_MATCHING_URL:-http://cv-matching-ai:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8081; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  recruitment-service:
    build:
      context: ./backend
      args:
        SERVICE: recruitment-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://recruitment-db:3306/hirelens_recruitment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: hirelens
      DB_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      JWT_SECRET: ${JWT_SECRET:-HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
      AI_URL: http://interview-ai:8000
      AI_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      AI_READ_TIMEOUT_MS: 180000
      CV_EXTRACTION_URL: ${CV_EXTRACTION_URL:-http://cv-extraction-ai:8000}
      CV_MATCHING_URL: ${CV_MATCHING_URL:-http://cv-matching-ai:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      recruitment-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    volumes:
      - recruitment_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8082; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  interview-service:
    build:
      context: ./backend
      args:
        SERVICE: interview-service
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://interview-db:3306/hirelens_interview?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: hirelens
      DB_PASSWORD: ${DB_PASSWORD:-hirelens-local}
      JWT_SECRET: ${JWT_SECRET:-HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-hirelens-local-service-token-change-before-deploy}
      IDENTITY_URL: http://identity-service:8081
      RECRUITMENT_URL: http://recruitment-service:8082
      INTERVIEW_URL: http://interview-service:8083
      AI_URL: http://interview-ai:8000
      AI_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      AI_READ_TIMEOUT_MS: 180000
      CV_EXTRACTION_URL: ${CV_EXTRACTION_URL:-http://cv-extraction-ai:8000}
      CV_MATCHING_URL: ${CV_MATCHING_URL:-http://cv-matching-ai:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      interview-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8083; printf ''GET /health HTTP/1.0\r\n\r\n'' >&3; head -1 <&3 | grep -q 200"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api-gateway:
    image: nginx:1.28-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
      recruitment-service:
        condition: service_healthy
      interview-service:
        condition: service_healthy

  interview-ai:
    profiles: [ai]
    build:
      context: ./AI
    environment:
      HIRELENS_MODE: ${INTERVIEW_SCORING_MODE:-bertscore}
      HIRELENS_DEVICE: cpu
      HIRELENS_THREADS: "2"
      HIRELENS_BATCH_SIZE: "4"
      HIRELENS_BERT_MODEL: ${INTERVIEW_BERT_MODEL:-bert-base-multilingual-cased}
      HIRELENS_CRITERION_THRESHOLD: ${INTERVIEW_CRITERION_THRESHOLD:-0.85}
      HIRELENS_OUTPUT: /app/output/module3-v2
      HIRELENS_FINETUNE_DIR: /app/output/bert_finetuned_self/model
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    cpus: 2.0
    mem_limit: 4g
    volumes:
      - interview_model_cache:/root/.cache/huggingface
      - interview_ai_output:/app/output/module3-v2
      - ./AI/output/bert_finetuned_self/model:/app/output/bert_finetuned_self/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 120s
    ports:
      - "127.0.0.1:8000:8000"

  cv-extraction-ai:
    profiles: [cv-ai]
    build:
      context: ./services/cv-extraction-ai
    environment:
      PROMPT_VERSION: ${CV_MODEL_VERSION:-v4}
      GGUF_MODEL_PATH: /app/merged_model/model-${CV_MODEL_VERSION:-v4}-q4_k_m.gguf
      KG_ENABLED: "true"
    volumes:
      - ./models/cv-extraction:/app/merged_model:ro
    ports:
      - "127.0.0.1:8001:8000"

  cv-matching-ai:
    profiles: [cv-ai]
    build:
      context: ./services/cv-matching-ai
    environment:
      MATCHMAKING_REQUIRE_MODEL: "true"
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MATCHMAKING_EMBEDDING_BACKEND: ${MATCHMAKING_EMBEDDING_BACKEND:-sentence-transformers}
    volumes:
      - matching_model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  hirelens_mysql_data:
  identity_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/mysql/identity
  recruitment_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/mysql/recruitment
  interview_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/mysql/interview
  matching_model_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/huggingface
  recruitment_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/uploads
  interview_model_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/interview-huggingface
  interview_ai_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_ROOT:-/run/media/long/DATA/project/DO_AN/recruit_system/data/runtime}/interview-output
