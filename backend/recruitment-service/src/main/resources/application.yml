server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: recruitment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/hirelens_recruitment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:hirelens}
    password: ${DB_PASSWORD:hirelens-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
app:
  identity:
    remote: true
  jwt:
    secret: ${JWT_SECRET:HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  services:
    token: ${SERVICE_TOKEN:hirelens-local-service-token-change-before-deploy}
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    recruitment-url: ${RECRUITMENT_URL:http://localhost:8082}
    interview-url: ${INTERVIEW_URL:http://localhost:8083}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  cv-extraction:
    base-url: ${CV_EXTRACTION_URL:http://localhost:8001}
  # Module match CV <-> JD (services/cvmatch-ai, plan I05/I06)
  cvmatch:
    base-url: ${CVMATCH_URL:http://localhost:8003}
    service-token: ${SERVICE_TOKEN:hirelens-local-service-token-change-before-deploy}
    read-timeout-ms: ${CVMATCH_READ_TIMEOUT_MS:120000}
    sync:
      enabled: ${CVMATCH_SYNC_ENABLED:true}
      retry-interval-ms: ${CVMATCH_SYNC_RETRY_MS:60000}
  ai:
    base-url: ${AI_URL:http://localhost:8000}
    enabled: true
    mode: ${AI_MODE:fast}
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    fallback-to-rule: false
