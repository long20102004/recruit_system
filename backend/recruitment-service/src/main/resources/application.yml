server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: recruitment-service
  # Đọc biến từ file .env ở gốc repo khi chạy trên máy (IDE / java -jar). Biến môi trường thật vẫn được ưu tiên.
  # Thử theo thư mục làm việc: gốc repo, backend/, backend/<module>/. Thiếu file thì bỏ qua.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/hirelens_recruitment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:hirelens}
    password: ${DB_PASSWORD:hirelens-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 500ms
      connect-timeout: 500ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      # Message không route được bị trả về (OutboxRelay coi là lỗi, gửi lại sau)
      mandatory: true
app:
  outbox:
    enabled: true
  identity:
    remote: true
  jwt:
    secret: ${JWT_SECRET:HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  services:
    token: ${SERVICE_TOKEN:hirelens-local-service-token-change-before-deploy}
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    recruitment-url: ${RECRUITMENT_URL:http://localhost:8082}
    interview-url: ${INTERVIEW_URL:http://localhost:8083}
  upload:
    # Chỉ còn dùng làm nguồn đọc khi migrate file cũ lên R2 (storage.migrate-local)
    path: ${UPLOAD_PATH:./uploads}
  cv-extraction:
    base-url: ${CV_EXTRACTION_URL:http://localhost:8001}
  gotenberg:
    base-url: ${GOTENBERG_URL:http://localhost:3100}
    timeout-ms: ${GOTENBERG_TIMEOUT_MS:20000}
  # Module match CV <-> JD (services/cvmatch-ai, plan I05/I06)
  cvmatch:
    base-url: ${CVMATCH_URL:http://localhost:8003}
    service-token: ${SERVICE_TOKEN:hirelens-local-service-token-change-before-deploy}
    read-timeout-ms: ${CVMATCH_READ_TIMEOUT_MS:120000}
    sync:
      enabled: ${CVMATCH_SYNC_ENABLED:true}
      retry-interval-ms: ${CVMATCH_SYNC_RETRY_MS:60000}
  ai:
    base-url: ${AI_URL:http://localhost:8000}
    enabled: true
    mode: ${AI_MODE:fast}
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    fallback-to-rule: false
# Cloudflare R2 (specs/008-r2-storage). Secret chỉ qua biến môi trường.
storage:
  migrate-local: ${STORAGE_MIGRATE_LOCAL:false}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    private-bucket: ${R2_PRIVATE_BUCKET:}
    public-bucket: ${R2_PUBLIC_BUCKET:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    endpoint: ${R2_ENDPOINT:}
    presign-ttl: ${R2_PRESIGN_TTL:5m}
