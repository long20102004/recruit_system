server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/hirelens_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:hirelens}
    password: ${DB_PASSWORD:hirelens-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 500ms
      connect-timeout: 500ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
app:
  auth:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:HireLens <no-reply@hirelens.local>}
    verify-token-ttl: 24h
    reset-token-ttl: 30m
    resend-cooldown: 60s
    max-failed-logins: 5
    failed-login-window: 15m
    login-lock-duration: 15m
  identity:
    remote: false
  jwt:
    secret: ${JWT_SECRET:HireLensDemoJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  services:
    token: ${SERVICE_TOKEN:hirelens-local-service-token-change-before-deploy}
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    recruitment-url: ${RECRUITMENT_URL:http://localhost:8082}
    interview-url: ${INTERVIEW_URL:http://localhost:8083}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  ai:
    base-url: ${AI_URL:http://localhost:8000}
    enabled: true
    mode: ${AI_MODE:fast}
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    fallback-to-rule: false
